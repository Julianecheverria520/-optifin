<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- App instalable (PWA) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111c43">
    <link rel="icon" type="image/png" href="iconos/favicon-32.png">
    <link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="OptiFin">
    <title>OptiFin - Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; background-color: #f8fafc; } </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Lado Izquierdo (Branding) -->
    <div class="hidden lg:flex flex-col justify-center items-center w-1/2 bg-[#111c43] text-white p-12 relative overflow-hidden">
        <div class="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
        <div class="z-10 text-center flex flex-col items-center">
            <div class="flex items-center gap-3 mb-4">
                <svg class="w-12 h-12 text-blue-400" fill="currentColor" viewBox="0 0 24 24"><path d="M3 13h2v8H3zm4-5h2v13H7zm4 4h2v9h-2zm4-6h2v15h-2zm4-4h2v19h-2z"/></svg>
                <h1 class="text-4xl font-bold tracking-wide">OptiFin</h1>
            </div>
            <p class="text-blue-200 text-lg max-w-md">Tu dinero, en orden. Gestiona cuentas, gastos compartidos y presupuestos en un solo lugar.</p>
        </div>
    </div>

    <!-- Lado Derecho (Formularios) -->
    <div class="w-full lg:w-1/2 flex items-center justify-center p-8 bg-white">
        <div class="w-full max-w-sm">
            
            <!-- Selector Tabs -->
            <div class="flex bg-gray-100 p-1 rounded-xl mb-8">
                <button id="tab-login" onclick="cambiarTab('login')" class="flex-1 py-2 rounded-lg font-bold text-sm bg-white shadow text-gray-800 transition-all">Iniciar Sesión</button>
                <button id="tab-registro" onclick="cambiarTab('registro')" class="flex-1 py-2 rounded-lg font-bold text-sm text-gray-500 hover:text-gray-800 transition-all">Crear Cuenta</button>
            </div>

            <!-- Panel de Login -->
            <form id="form-login" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Correo Electrónico</label>
                    <input type="email" id="log_email" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Contraseña</label>
                    <input type="password" id="log_password" required autocomplete="current-password" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="flex items-center">
                    <input type="checkbox" id="recordarme" class="w-4 h-4 text-blue-600 rounded border-gray-300">
                    <label for="recordarme" class="ml-2 text-sm text-gray-600 cursor-pointer">Mantener sesión iniciada</label>
                </div>
                <button type="submit" class="w-full bg-[#111c43] hover:bg-black text-white font-bold py-3.5 rounded-xl shadow-lg transition-all mt-2">Entrar a mi cuenta</button>
            </form>

            <!-- Panel de Registro -->
            <form id="form-registro" class="space-y-5 hidden">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Nombre Completo</label>
                    <input type="text" id="reg_nombre" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Correo Electrónico</label>
                    <input type="email" id="reg_email" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Contraseña</label>
                    <input type="password" id="reg_password" required minlength="6" autocomplete="new-password" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none">
                    <p class="text-xs text-gray-400 mt-1">Mínimo 6 caracteres.</p>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Confirmar Contraseña</label>
                    <input type="password" id="reg_password2" required minlength="6" autocomplete="new-password" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all mt-2">Crear mi cuenta</button>
            </form>

            <div id="error_msg" class="hidden mt-6 bg-red-50 text-red-600 border border-red-200 p-3 rounded-lg text-sm font-semibold text-center"></div>

            <button type="button" onclick="instalarApp()" class="boton-instalar hidden mt-6 w-full flex items-center justify-center gap-3 py-3 rounded-xl border-2 border-[#111c43] text-[#111c43] font-bold hover:bg-gray-50">
                <img src="iconos/icono-192.png" alt="" class="w-7 h-7 rounded-lg"> Instalar OptiFin en este dispositivo
            </button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/pwa.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
